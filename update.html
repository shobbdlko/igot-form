    <!-- JavaScript Handling Search & Update -->
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby3MQebmSGAQLM6j9ILyGKm1Ss59ehFHX1tFn4hyINO7_1UhidPhB_m8BQ5rLbWvlAA4g/exec';

        // 1. PNO Search Function
        function searchPno() {
            const pnoInput = document.getElementById('loginPno').value.trim();
            const statusDiv = document.getElementById('status');
            const searchBtn = document.getElementById('searchBtn');

            if (!pnoInput) {
                showStatus('warning', 'कृपया अपना PNO नंबर दर्ज करें!');
                return;
            }

            searchBtn.disabled = true;
            searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> खोजा जा रहा है...';

            const formData = new URLSearchParams();
            formData.append('action', 'search');
            formData.append('pno', pnoInput);

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Search & Login';

                if (data.result === 'success') {
                    // डेटा मिल गया, फॉर्म दिखाएं
                    document.getElementById('displayName').value = data.name;
                    document.getElementById('displayPno').value = data.pno;

                    // पहले से चुने गए कोर्सेज को टिक करें
                    const userCourses = data.courses ? data.courses.split(', ') : [];
                    document.querySelectorAll('input[name="courses"]').forEach(checkbox => {
                        checkbox.checked = userCourses.includes(checkbox.value);
                    });

                    // व्यू स्विच करें
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('updateSection').classList.remove('hidden');
                    statusDiv.classList.add('hidden');
                } else {
                    // गलत PNO दर्ज करने पर एरर मैसेज
                    showStatus('error', '<i class="fa-solid fa-circle-exclamation text-base"></i> गलत PNO दर्ज किया गया है! यह PNO रिकॉर्ड में मौजूद नहीं है।');
                }
            })
            .catch(error => {
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Search & Login';
                showStatus('error', 'सर्वर से कनेक्ट करने में त्रुटि हुई। कृपया पुनः प्रयास करें।');
                console.error('Error:', error);
            });
        }

        // 2. Update Form Submission
        document.getElementById('updateForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const statusDiv = document.getElementById('status');
            const updateBtn = document.getElementById('updateBtn');

            const checkedCourses = [];
            document.querySelectorAll('input[name="courses"]:checked').forEach((checkbox) => {
                checkedCourses.push(checkbox.value);
            });

            if (checkedCourses.length === 0) {
                showStatus('warning', 'कृपया कम से कम एक कोर्स अवश्य चुनें!');
                return;
            }

            updateBtn.disabled = true;
            updateBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> अपडेट हो रहा है...';

            const formData = new URLSearchParams();
            formData.append('action', 'update');
            formData.append('name', document.getElementById('displayName').value);
            formData.append('pno', document.getElementById('displayPno').value);
            formData.append('courses', checkedCourses.join(', '));

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                updateBtn.disabled = false;
                updateBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Update Changes';

                if (data.result === 'success') {
                    showStatus('success', '<i class="fa-solid fa-circle-check text-base"></i> डेटा सफलतापूर्वक अपडेट कर दिया गया है!');
                } else {
                    showStatus('error', 'अपडेट करने में त्रुटि: ' + data.message);
                }
            })
            .catch(error => {
                updateBtn.disabled = false;
                updateBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Update Changes';
                showStatus('error', 'सर्वर एरर। कृपया पुनः प्रयास करें।');
            });
        });

        function resetLogin() {
            document.getElementById('updateSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginPno').value = '';
            document.getElementById('status').classList.add('hidden');
        }

        function showStatus(type, message) {
            const statusDiv = document.getElementById('status');
            statusDiv.classList.remove('hidden');
            if (type === 'error') {
                statusDiv.className = 'mt-4 p-4 rounded-2xl text-xs sm:text-sm font-semibold flex items-center gap-3 bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20';
            } else if (type === 'success') {
                statusDiv.className = 'mt-4 p-4 rounded-2xl text-xs sm:text-sm font-semibold flex items-center gap-3 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20';
            } else {
                statusDiv.className = 'mt-4 p-4 rounded-2xl text-xs sm:text-sm font-semibold flex items-center gap-3 bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20';
            }
            statusDiv.innerHTML = message;
        }
    </script>
</body>
</html>
