<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iGOT Karmyogi Course Status Form - PS BBD LKO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .custom-checkbox:checked + label {
            border-color: #3b82f6;
            background-color: rgba(59, 130, 246, 0.12);
        }
        .custom-checkbox:checked + label .check-box {
            border-color: #2563eb;
            background-color: #2563eb;
            color: #ffffff;
        }
        .custom-checkbox:checked + label .check-icon {
            opacity: 1;
            transform: scale(1);
        }
        .custom-checkbox + label .check-icon {
            opacity: 0;
            transform: scale(0.75);
            transition: all 0.15s ease;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen py-8 px-4 transition-colors duration-300">

    <!-- Glowing Background Decorative Effects -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-500/20 dark:bg-blue-600/15 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-indigo-500/20 dark:bg-indigo-600/15 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-emerald-500/20 dark:bg-emerald-600/15 rounded-full blur-3xl"></div>
    </div>

    <div class="max-w-2xl mx-auto">

        <!-- Header Card -->
        <header class="glass rounded-3xl p-6 mb-6 text-center shadow-lg relative overflow-hidden">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center text-3xl mx-auto mb-3 shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent dark:from-blue-400 dark:via-indigo-400 dark:to-purple-400">
                iGOT Karmyogi Course Status
            </h1>
            <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1 font-medium">
                <i class="fa-solid fa-building-shield text-blue-500 mr-1"></i> Police Station BBD, Lucknow
            </p>
        </header>

        <!-- Main Form Card -->
        <main class="glass rounded-3xl p-6 sm:p-8 shadow-xl">
            <form id="userForm" class="space-y-6">

                <!-- Personal Details Section -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="name" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">
                            <i class="fa-solid fa-user text-blue-500 mr-1"></i> Enter Your Name *
                        </label>
                        <input type="text" id="name" name="name" required placeholder="अपना पूरा नाम दर्ज करें"
                            class="w-full px-4 py-3 rounded-2xl bg-slate-100/80 dark:bg-slate-900/80 border border-slate-300/80 dark:border-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>
                    <div>
                        <label for="pno" class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-2">
                            <i class="fa-solid fa-id-card text-blue-500 mr-1"></i> Enter Your PNO *
                        </label>
                        <input type="text" id="pno" name="pno" required placeholder="PNO संख्या दर्ज करें"
                            class="w-full px-4 py-3 rounded-2xl bg-slate-100/80 dark:bg-slate-900/80 border border-slate-300/80 dark:border-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                    </div>
                </div>

                <!-- Courses Selection Section -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">
                            <i class="fa-solid fa-book-open text-blue-500 mr-1"></i> Courses (Check all You Can Complete):
                        </label>
                        <span id="selectedCount" class="text-xs font-semibold text-blue-500">0 Selected</span>
                    </div>

                    <div id="coursesContainer" class="space-y-2.5">
                        <div class="p-6 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/40 text-center text-xs sm:text-sm text-slate-500 dark:text-slate-400">
                            <i class="fa-solid fa-circle-notch fa-spin text-blue-500 mr-2"></i> WeeklyCourse शीट से कोर्सेस लोड हो रहे हैं...
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold text-sm shadow-lg shadow-blue-500/25 active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> Submit Form
                </button>
            </form>

            <!-- Status Alert Box -->
            <div id="status" class="hidden mt-4 p-4 rounded-2xl text-xs sm:text-sm font-semibold flex items-center gap-3 transition-all"></div>
        </main>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyvdPP8sGi2v72GiZomfmNya_qpC5NOr9JH2wyxmmJ73Ic5K90-iJQcUKqs8U7Wp-wp5g/exec';

        const coursesContainer = document.getElementById('coursesContainer');
        const selectedCountEl = document.getElementById('selectedCount');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');
        let totalCoursesCount = 0;

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function updateSelectedCount() {
            const count = document.querySelectorAll('input[name="courses"]:checked').length;
            selectedCountEl.textContent = totalCoursesCount > 0
                ? `${count} / ${totalCoursesCount} Selected`
                : `${count} Selected`;
        }

        function showStatus(type, message) {
            const styles = {
                info: 'bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20',
                success: 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20',
                warn: 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20',
                error: 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20'
            };
            const icons = {
                info: 'fa-circle-notch fa-spin',
                success: 'fa-circle-check',
                warn: 'fa-triangle-exclamation',
                error: 'fa-circle-exclamation'
            };

            statusDiv.className = `mt-4 p-4 rounded-2xl text-xs sm:text-sm font-semibold flex items-center gap-3 transition-all ${styles[type] || styles.info}`;
            statusDiv.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-base shrink-0"></i><span>${message}</span>`;
            statusDiv.classList.remove('hidden');
        }

        function renderCourses(courses) {
            totalCoursesCount = courses.length;
            if (!courses.length) {
                coursesContainer.innerHTML = `
                    <div class="p-6 rounded-2xl border border-amber-500/20 bg-amber-500/10 text-center text-xs sm:text-sm text-amber-600 dark:text-amber-400">
                        WeeklyCourse शीट में कोई कोर्स नहीं मिला।
                    </div>`;
                updateSelectedCount();
                return;
            }

            coursesContainer.innerHTML = courses.map((course, index) => {
                const num = String(index + 1).padStart(2, '0');
                const code = (course.code || `Course ${num}`).trim();
                const title = (course.title || code).trim();
                const dateText = course.date ? ` <span class="text-slate-400 text-[11px] font-normal">(${escapeHtml(course.date)})</span>` : '';
                const domId = `course_opt_${index + 1}`;

                return `
                    <div class="relative">
                        <input type="checkbox" id="${escapeHtml(domId)}" name="courses" value="${escapeHtml(code)}" class="custom-checkbox hidden">
                        <label for="${escapeHtml(domId)}" class="flex items-center gap-3 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/40 hover:bg-slate-100 dark:hover:bg-slate-800/60 cursor-pointer transition-all">
                            <div class="check-box w-5 h-5 rounded-lg border-2 border-slate-400 flex items-center justify-center text-xs shrink-0 transition-all">
                                <i class="fa-solid fa-check check-icon"></i>
                            </div>
                            <span class="text-xs sm:text-sm font-medium">
                                <span class="font-bold text-blue-500 mr-1">[${escapeHtml(code)}]</span>
                                ${escapeHtml(title)}${dateText}
                            </span>
                        </label>
                    </div>`;
            }).join('');

            document.querySelectorAll('input[name="courses"]').forEach((cb) => {
                cb.addEventListener('change', updateSelectedCount);
            });
            updateSelectedCount();
        }

        async function loadWeeklyCourses() {
            try {
                const res = await fetch(`${SCRIPT_URL}?action=getCourses`);
                const data = await res.json();
                if (data.result === 'success' && Array.isArray(data.courses)) {
                    renderCourses(data.courses);
                } else {
                    throw new Error(data.message || 'Failed to load courses');
                }
            } catch (err) {
                console.error('Course fetch error:', err);
                coursesContainer.innerHTML = `
                    <div class="p-5 rounded-2xl border border-rose-500/20 bg-rose-500/10 text-center text-xs sm:text-sm text-rose-600 dark:text-rose-400">
                        कोर्सेस लोड करने में समस्या आई। कृपया पेज रिफ्रेश करें।
                    </div>`;
            }
        }

        document.getElementById('userForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nameVal = document.getElementById('name').value.trim();
            const pnoVal = document.getElementById('pno').value.trim();

            if (!nameVal || !pnoVal) {
                showStatus('warn', 'कृपया नाम और PNO दोनों दर्ज करें!');
                return;
            }

            const checkedCourses = [];
            document.querySelectorAll('input[name="courses"]:checked').forEach((checkbox) => {
                checkedCourses.push(checkbox.value);
            });

            if (checkedCourses.length === 0) {
                showStatus('warn', 'कृपया कम से कम एक कोर्स (Course) अवश्य चुनें!');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';
            showStatus('info', 'Submitting data, please wait...');

            const formData = new URLSearchParams();
            formData.append('name', nameVal);
            formData.append('pno', pnoVal);
            formData.append('courses', checkedCourses.join(', '));

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Form';

                if (data.result === 'success') {
                    showStatus('success', `Data submitted successfully! (${escapeHtml(data.courses || checkedCourses.join(', '))})`);
                    document.getElementById('userForm').reset();
                    updateSelectedCount();
                } else if (data.result === 'updated') {
                    showStatus('success', `PNO ${escapeHtml(data.pno)} का रिकॉर्ड अपडेट हो गया: ${escapeHtml(data.courses)}`);
                    document.getElementById('userForm').reset();
                    updateSelectedCount();
                } else {
                    showStatus('warn', 'Error: ' + escapeHtml(data.message || 'Unknown error'));
                }
            })
            .catch(error => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Form';
                showStatus('error', 'Error submitting form. Please try again.');
                console.error('Error:', error);
            });
        });

        loadWeeklyCourses();
    </script>
</body>
</html>
